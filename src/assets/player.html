<script>
document.documentElement.classList.add('js');
const D = __DATA__;
/* The look is DOCUMENT DATA: the theme the AI set through MCP drives every
   default below. Component params still override per-instance. */
const T = Object.assign(
  { paper: '#0B1020', ink: '#E8ECF8', accent: '#FFC857', accent2: '#E8950C', accentInk: '#1A1205', bg: {} },
  D.theme || {}
);
{
  const rs = document.documentElement.style;
  rs.setProperty('--stage-void', T.paper);
  rs.setProperty('--vid-white', T.ink);
  rs.setProperty('--vid-ink-2', T.ink);
  rs.setProperty('--vid-accent', T.accent);
  rs.setProperty('--vid-accent-hot', T.accent);
  rs.setProperty('--vid-gold', T.accent2);
  rs.setProperty('--vid-accent-ink', T.accentInk);
}
const $ = s => document.querySelector(s);
const stageBox = $('#stage-box'), stage = $('#stage'), zoomer = $('#zoomer');

/* Sizing and aspect ratio */
const pWidth = D.width || 1080, pHeight = D.height || 1920;
const aspect = pWidth / pHeight;
function fit() {
  const maxH = Math.max(280, innerHeight - 200);
  const maxW = Math.max(280, innerWidth - 48);
  let h = maxH, w = h * aspect;
  if (w > maxW) { w = maxW; h = w / aspect; }
  stageBox.style.width = Math.round(w) + 'px';
  stageBox.style.height = Math.round(h) + 'px';
  stageBox.style.setProperty('--sx', Math.min(2.2, w / 340).toFixed(4));
  stageBox.style.setProperty('--sy', (h / 604).toFixed(4));
  $('#bar').style.width = Math.round(Math.max(w, 320)) + 'px';
  $('#hint').style.width = Math.round(Math.max(w, 320)) + 'px';
  resizeCanvas();
}
addEventListener('resize', fit);

/* Scene Canvas */
const canvas = $('#scene-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  const rect = stageBox.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
}
fit();

/* Ambient Particle System (Topic-agnostic subtle motion) */
const particles = [];
for (let i = 0; i < 48; i++) {
  particles.push({
    x: Math.random() * 1080,
    y: Math.random() * 1920,
    r: 1.2 + Math.random() * 2.4,
    speed: 12 + Math.random() * 28,
    alpha: 0.15 + Math.random() * 0.45,
    seed: Math.random() * 100
  });
}

/* Scene lookup from document tracks / analysis */
const scenesTrack = (D.tracks || []).find(t => t.role === 'scenes' || t.kind === 'scenes');
const allScenes = (scenesTrack ? scenesTrack.items : []) || (D.analysis ? D.analysis.scenes : []) || [];

function getActiveScene(time) {
  return allScenes.find(s => time >= s.start && time < s.end) || null;
}

/* Image cache for imageOverlay components */
const imgCache = {};
function getImage(src) {
  if (!src) return null;
  if (!imgCache[src]) {
    const img = new Image();
    img.src = src;
    imgCache[src] = img;
  }
  return imgCache[src].complete && imgCache[src].naturalWidth > 0 ? imgCache[src] : null;
}

/* A point param is {x, y} in 0–1 frame space. Anything else (a scalar, a
   constant left over from a template, null) falls back to the given default,
   so a malformed param never turns a component into NaN geometry. */
/* Monogram from document data, never from a baked-in placeholder string. */
function initialsOf(value) {
  const parts = String(value || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '';
  return (parts.length === 1 ? parts[0].slice(0, 2) : parts[0][0] + parts[1][0]).toUpperCase();
}

/* Deterministic 0–1 noise for particle layouts: stable across frames, so
   these components animate smoothly instead of flickering. */
function hash01(n) {
  const v = Math.sin(n * 12.9898) * 43758.5453;
  return v - Math.floor(v);
}

function pointOf(value, fallbackX, fallbackY) {
  if (value && typeof value === 'object' &&
      typeof value.x === 'number' && typeof value.y === 'number' &&
      isFinite(value.x) && isFinite(value.y)) {
    return { x: value.x, y: value.y };
  }
  return { x: fallbackX, y: fallbackY };
}



/* @@COMPONENTS@@ */



/* 2. Custom Code Overlays (codeOverlay_<slug> or params.code) */
function executeCodeOverlays(ctx, W, H, time) {
  const activeCodeOverlays = (D.components || []).filter(c =>
    (c.componentId.startsWith('codeOverlay_') || (c.params && c.params.code)) &&
    time >= c.start && time <= c.end
  );

  activeCodeOverlays.forEach(c => {
    if (!c._compiled && c.params && c.params.code) {
      try {
        c._compiled = new Function('ctx', 'W', 'H', 'time', 'localTime', 'params', 'words', c.params.code);
      } catch (err) {
        console.warn('Failed to compile codeOverlay:', c.componentId, err);
        c._compiled = null;
      }
    }
    if (c._compiled) {
      ctx.save();
      try {
        const localTime = Math.max(0, time - c.start);
        c._compiled(ctx, W, H, time, localTime, c.params || {}, D.words || []);
      } catch (err) {
        console.warn('Error executing codeOverlay:', c.componentId, err);
      }
      ctx.restore();
    }
  });
}





/* 4. Unified Scene Renderer */
function renderScene(time) {
  const w = canvas.width, h = canvas.height;
  if (!w || !h) return;
  /* Start every frame from a clean state stack: a component that throws can
     never carry a bad transform into the next frame. */
  if (typeof ctx.reset === 'function') ctx.reset();
  else ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);

  /* 1080-wide drawing space with the stage's own aspect: a 16:9 project
     keeps circles round instead of being squashed into 9:16. */
  const W = 1080, H = 1080 * h / w;
  ctx.save();
  ctx.scale(w / W, h / H);

  sharedSceneTransforms(ctx, D.components || [], W, H, time);

  // 1. Procedural Scene Background — background components override scene style
  const scene = sharedSceneOverride(D.components || [], time) || getActiveScene(time);
  sharedBackground(ctx, W, H, time, scene, particles);

  // 2. Custom Code Overlays (User animated scripts)
  executeCodeOverlays(ctx, W, H, time);

  // 3. Parametric Graphic Overlays
  drawSharedComponents(ctx, W, H, time, D.components || [], {
    skip: DRAW_FALLBACK_IDS, canvas: canvas, docName: D.name
  });

  // 4. Effects and overlay transitions
  sharedPostFX(ctx, W, H, time, D.components || [], canvas);

  ctx.restore();
}

/* Kinetic words with phrase segmentation */
const words = D.words || [];
const kin = $('#kinetic');
const comps = D.components || [];
const byId = id => comps.filter(c => c.componentId === id);
const kinC = byId('kineticWords')[0] || byId('captions')[0];
const kinP = (kinC && kinC.params) || {};
const activeColor = kinP.activeColor || T.accent;
const emphasisColor = kinP.emphasisColor || kinP.activeColor || T.accent;
const fontFamily = kinP.fontFamily || "'Space Grotesk', -apple-system, sans-serif";
const wordColors = kinP.wordColors || {};
const emSet = new Set(kinP.emphasis || []);

kin.style.setProperty('--kw-active-color', activeColor);
kin.style.setProperty('--kw-emphasis-color', emphasisColor);
if (kinP.fontFamily) kin.style.fontFamily = fontFamily;
/* layout is a component decision: position and size come from params */
if (kinP.position && typeof kinP.position.y === 'number') {
  kin.style.bottom = 'auto';
  kin.style.top = (kinP.position.y * 100) + '%';
  kin.style.transform = 'translateY(-50%)';
  kin.style.alignItems = 'center';
}
if (typeof kinP.size === 'number' && kinP.size > 0) {
  kin.style.setProperty('--kin-size', (1.88 * kinP.size) + 'rem');
  kin.style.setProperty('--kin-long-size', (1.42 * kinP.size) + 'rem');
}

/* High-Retention Micro-Phrase Segmentation:
   Groups words into punchy 2-3 word chunks (max 4 short words).
   Prevents text clutter, giving that dynamic, high-energy YouTube Shorts rhythm. */
let phrases = [];
if (words.length > 0) {
  let curr = [];
  words.forEach((w, i) => {
    curr.push(w);
    const txt = w.text.trim();
    const isMajor = /[.!?:]$/.test(txt);
    const isComma = txt.endsWith(',');
    const isLast = (i === words.length - 1);

    let nextIsSoloEnder = false;
    if (i + 1 < words.length) {
      const nextTxt = words[i + 1].text.trim();
      if (/[.!?:]$/.test(nextTxt)) nextIsSoloEnder = true;
    }

    const shouldBreak = isMajor
      || (isComma && curr.length >= 2)
      || (curr.length >= 3 && !nextIsSoloEnder)
      || isLast;

    if (shouldBreak) {
      phrases.push({
        start: curr[0].start,
        end: curr[curr.length - 1].end + 0.35,
        words: [...curr]
      });
      curr = [];
    }
  });

  for (let i = 0; i < phrases.length; i++) {
    if (i + 1 < phrases.length) {
      const nextStart = phrases[i + 1].start;
      if (nextStart - phrases[i].end < 0.55) {
        phrases[i].end = nextStart;
      }
    }
  }
}

let curPhraseIdx = -1;

const chapters = D.chapters || [];
const track = $('#track');
chapters.forEach(c => {
  const m = document.createElement('div');
  m.className = 'ch';
  m.style.left = (c.start / D.duration * 100) + '%';
  m.title = c.title;
  track.appendChild(m);
});

/* Narration audio (the asset synthesize_speech wrote) */
const narrationAudio = new Audio();
narrationAudio.preload = 'auto';
let hasRealAudio = false;
if (D.audioData) {
  narrationAudio.src = D.audioData;
  hasRealAudio = true;
}
narrationAudio.addEventListener('error', () => {
  console.warn('Audio failed to load from', narrationAudio.src);
});

/* Narration fallback: no audio asset in the bundle => word-synced speech */
let audioCtx = null;
function initAudioCtx() {
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) { try { audioCtx = new AC(); } catch (e) {} }
}
function playVoiceTone(freq, dur) {
  if (isMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
let spokenId = null;
let spokenSeg = null;
let speechOk = null;
function speechReady() {
  if (speechOk !== null) return speechOk;
  try { speechOk = 'speechSynthesis' in window && typeof speechSynthesis.speaking === 'boolean'; }
  catch (e) { speechOk = false; }
  return speechOk;
}
window._narrationCount = 0;
let narrVoice = null;
function pickNarrVoice() {
  try {
    const en = speechSynthesis.getVoices().filter(v => v.lang && v.lang.indexOf('en') === 0);
    narrVoice = en.length ? en[0] : null;
  } catch (e) { narrVoice = null; }
}
function speakSentence(text) {
  if (isMuted) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.15; u.volume = 0.55;
    if (!narrVoice) pickNarrVoice();
    if (narrVoice) u.voice = narrVoice;
    speechSynthesis.speak(u);
    window._narrationCount++;
  } catch (e) { speechOk = false; }
}
function speakWord(text) {
  if (isMuted) return;
  playVoiceTone(280 + text.length * 15, 0.12);
  window._narrationCount++;
}
function stopSpeech() {
  try { if (speechReady()) speechSynthesis.cancel(); } catch (e) {}
  spokenId = null;
  spokenSeg = null;
}

let isMuted = false;

const PLAY_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';
const MUTE_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true" id="mute-svg"><path d="M11 2.5a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.85.35L6.3 9H3a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3.3l4.35-4.35a.5.5 0 0 1 .35-.15zM13 5a1 1 0 0 1 1 1v4a1 1 0 0 1-2 0V6a1 1 0 0 1 1-1z"/></svg>';
const UNMUTE_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2.5a.5.5 0 0 1 .5.5v10a.5.5 0 0 1-.85.35L6.3 9H3a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h3.3l4.35-4.35a.5.5 0 0 1 .35-.15zM12.5 7.5l2-2m0 2l-2-2"/></svg>';

const startAt = parseFloat(new URLSearchParams(location.search).get('t') || '0') || 0;
let t = Math.min(startAt, D.duration), playing = false, raf = null, last = performance.now(), chLast = null;
if (t >= D.duration - 0.5) t = 0; // a restored ?t= tab must not open frozen at the end
const fmtc = x => { const m = Math.floor(x / 60), s = (x - m * 60).toFixed(1); return m + ':' + (s < 10 ? '0' : '') + s; };

function setPlaying(p) {
  playing = p;
  $('#play').innerHTML = p ? PAUSE_SVG : PLAY_SVG;
  $('#play').setAttribute('aria-label', p ? 'Pause' : 'Play');
  const overlay = $('#play-overlay');
  if (overlay) overlay.classList.toggle('hidden', p);
  if (p) {
    if (t >= D.duration - 0.2) t = 0;
    initAudioCtx();
    if (hasRealAudio) {
      narrationAudio.currentTime = t;
      narrationAudio.muted = isMuted;
      narrationAudio.play().catch(e => console.warn('Audio play prevented:', e));
    }
  } else {
    if (hasRealAudio) narrationAudio.pause();
    stopSpeech();
  }
  last = performance.now();
}

function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (playing) {
    if (hasRealAudio && !narrationAudio.paused && !narrationAudio.ended) {
      t = narrationAudio.currentTime;
    } else {
      t = Math.min(D.duration, t + dt);
    }
    if (t >= D.duration) setPlaying(false);
  }
  safeDraw();
  raf = requestAnimationFrame(frame);
}

/* One broken component must never freeze the video: draws are guarded. */
function safeDraw() {
  try { draw(); } catch (e) {
    if ((safeDraw.n || 0) < 5) { console.error('draw failed:', e); safeDraw.n = (safeDraw.n || 0) + 1; }
  }
}

function draw() {
  const k = D.duration > 0 ? (t / D.duration) : 0;
  $('#fill').style.transform = 'scaleX(' + k + ')';
  $('#dot').style.transform = 'translateX(' + (k * (track.clientWidth - 10)) + 'px)';
  $('#clock').textContent = fmtc(t) + ' / ' + fmtc(D.duration);

  /* Chapter pill: the title shows for the first seconds of its chapter. */
  let chap = null;
  for (const c of chapters) { if (t >= c.start) chap = c; }
  const chapEl = $('#chapter');
  if (chap && t - chap.start < 4) {
    chapEl.textContent = chap.title;
    chapEl.classList.add('show');
  } else {
    chapEl.classList.remove('show');
  }

  /* Render 60 FPS Living Scene */
  renderScene(t);

  /* Find active phrase */
  let activePhrase = null, pIdx = -1;
  for (let i = 0; i < phrases.length; i++) {
    if (t >= phrases[i].start && t <= phrases[i].end) {
      activePhrase = phrases[i];
      pIdx = i;
      break;
    }
  }

  /* Swap kinetic phrase if changed */
  if (pIdx !== curPhraseIdx) {
    curPhraseIdx = pIdx;
    kin.innerHTML = '';
    if (activePhrase) {
      activePhrase.words.forEach(w => {
        const el = document.createElement('span');
        el.textContent = w.text;
        el.dataset.id = w.id;
        if (kinP.fontFamily) el.style.fontFamily = fontFamily;
        const clean = w.text.toLowerCase().replace(/[^a-z0-9]/g, '');
        const isEmphasized = emSet.has(w.id) || emSet.has(clean) || emSet.has(w.text.trim());
        if (isEmphasized) {
          el.classList.add('kw-highlight');
        }
        if (wordColors[w.id] || wordColors[clean] || wordColors[w.text.trim()]) {
          el.dataset.customColor = wordColors[w.id] || wordColors[clean] || wordColors[w.text.trim()];
        }
        kin.appendChild(el);
      });
    }
    kin.classList.toggle('long', !!activePhrase && (activePhrase.words.length > 2 ||
      activePhrase.words.reduce((n, w) => n + w.text.length, 0) > 15));
  }

  /* Highlight words in active phrase */
  let activeWord = null;
  if (activePhrase) {
    const spans = [...kin.children];
    activePhrase.words.forEach((w, idx) => {
      const el = spans[idx];
      if (el) {
        const isPast = w.end <= t;
        const isCurrent = w.start <= t && w.end > t;
        el.classList.toggle('said', isPast);
        el.classList.toggle('now', isCurrent);
        if (isCurrent) {
          activeWord = w;
          if (el.dataset.customColor) {
            el.style.color = el.dataset.customColor;
            el.style.textShadow = '0 0 24px ' + el.dataset.customColor + ', 0 4px 18px #000';
          }
        } else if (!isPast) {
          if (el.dataset.customColor) {
            el.style.color = '';
            el.style.textShadow = '';
          }
        }
      }
    });
  }

  /* Narration: one fluent utterance per sentence, only without a real audio
     asset; word tones only if speech is unusable */
  if (playing && !hasRealAudio) {
    const seg = (D.segments || []).find(sg => t >= sg.start && t <= sg.end);
    if (speechReady()) {
      if (seg && seg.id !== spokenSeg) { spokenSeg = seg.id; speakSentence(seg.text); }
    } else if (activeWord && activeWord.id !== spokenId) {
      spokenId = activeWord.id;
      speakWord(activeWord.text.replace(/[^A-Za-z0-9'.,!?-]/g, ''));
    }
  }

  /* VU meter animation synced with audio */
  const vuL = $('#vu-l'), vuR = $('#vu-r');
  if (activeWord && playing && !isMuted) {
    const level = 0.4 + Math.random() * 0.55;
    vuL.style.transform = 'scaleY(' + level + ')';
    vuR.style.transform = 'scaleY(' + Math.min(1, level * 1.1) + ')';
    vuL.classList.add('active'); vuR.classList.add('active');
  } else {
    vuL.style.transform = 'scaleY(0.15)'; vuR.style.transform = 'scaleY(0.15)';
    vuL.classList.remove('active'); vuR.classList.remove('active');
  }

  const title = byId('titleCard').filter(c => t >= c.start && t <= c.end)[0];
  const counter = byId('numberCounter').filter(c => t >= c.start && t <= c.end)[0];
  const lower = byId('lowerThird').filter(c => t >= c.start && t <= c.end)[0];
  const on = c => c && t >= c.start && t <= c.end;

  /* Title card */
  const tEl = $('#title');
  if (on(title)) {
    tEl.classList.add('show');
    const tp = title.params || {};
    if (tp.position && typeof tp.position.y === 'number') {
      tEl.style.top = (tp.position.y * 100) + '%';
      tEl.style.transform = 'translateY(-50%)';
    }
    const hookEl = tEl.querySelector('h2');
    if (typeof tp.size === 'number' && tp.size > 0) {
      /* scale with the stage like every other overlay: a fixed rem size only
         looked right at the window width it was authored in, so an exported
         frame at project resolution drew a tiny title */
      hookEl.style.fontSize = 'calc(' + (1.8 * tp.size) + 'rem * var(--sx))';
    }
    const h2 = tEl.querySelector('h2'), p = tEl.querySelector('p');
    h2.textContent = tp.title || D.name;
    p.textContent = tp.subtitle || '';
    // shrink-to-fit: no title may spill past the stage edges
    const stageBoxEl = document.querySelector('#stage-box');
    for (let i = 0; i < 24 && h2.scrollWidth > stageBoxEl.clientWidth - 28; i++) {
      h2.style.fontSize = (parseFloat(getComputedStyle(h2).fontSize) * 0.88) + 'px';
    }
    if (tp.fontFamily) { h2.style.fontFamily = tp.fontFamily; p.style.fontFamily = tp.fontFamily; }
    if (tp.titleColor) h2.style.color = tp.titleColor;
    if (tp.subtitleColor) p.style.color = tp.subtitleColor;
  } else {
    tEl.classList.remove('show');
  }

  /* Counter */
  const cEl = $('#counter');
  if (on(counter)) {
    cEl.classList.add('show');
    const cp = counter.params || {}, span = Math.max(0.01, counter.end - counter.start);
    const prog = Math.min(1, (t - counter.start) / span * 1.15);
    const v = Math.round((cp.from ?? 0) + ((cp.to ?? 100) - (cp.from ?? 0)) * prog);
    const b = cEl.querySelector('b'), i = cEl.querySelector('i');
    b.textContent = (cp.prefix || '') + v.toLocaleString() + (cp.suffix || '');
    i.textContent = cp.label || '';
    if (cp.fontFamily) { b.style.fontFamily = cp.fontFamily; i.style.fontFamily = cp.fontFamily; }
    if (cp.numberColor) b.style.color = cp.numberColor;
    if (cp.labelColor) i.style.color = cp.labelColor;
  } else {
    cEl.classList.remove('show');
  }

  /* Lower third */
  const lowerEl = $('#lower');
  if (on(lower)) {
    lowerEl.classList.add('show');
    const lp = lower.params || {};
    const bar = lowerEl.querySelector('.bar'), sub = lowerEl.querySelector('.sub');
    bar.textContent = lp.title || '';
    sub.textContent = lp.subtitle || '';
    if (lp.fontFamily) { bar.style.fontFamily = lp.fontFamily; sub.style.fontFamily = lp.fontFamily; }
    if (lp.barColor) bar.style.background = lp.barColor;
    if (lp.textColor) bar.style.color = lp.textColor;
    if (lp.subColor) sub.style.color = lp.subColor;
    if (lp.subBg) sub.style.background = lp.subBg;
    if (lp.borderColor) sub.style.borderColor = lp.borderColor;
  } else {
    lowerEl.classList.remove('show');
  }


  /* Subtitle bar / captions strip follows the active phrase */
  const subC = byId('subtitleBar').find(c => t >= c.start && t <= c.end) ||
               byId('captions').find(c => t >= c.start && t <= c.end);
  const sb = $('#subbar');
  kin.style.display = subC ? 'none' : '';
  if (subC) {
    const phraseText = activePhrase ? activePhrase.words.map(w => w.text).join(' ') : '';
    if (sb._txt !== phraseText) {
      sb._txt = phraseText;
      sb.innerHTML = '<span class="sb-plate"></span>';
      sb.querySelector('.sb-plate').textContent = phraseText;
    }
    sb.classList.toggle('bar-style', subC.componentId === 'subtitleBar');
    sb.classList.add('show');
  } else {
    sb.classList.remove('show');
  }
}

const overlay = $('#play-overlay');
if (overlay) {
  overlay.addEventListener('click', (e) => {
    e.stopPropagation();
    setPlaying(true);
  });
}
$('#stage').addEventListener('click', () => setPlaying(!playing));
$('#play').addEventListener('click', (e) => {
  e.stopPropagation();
  setPlaying(!playing);
});
$('#rewind').addEventListener('click', () => {
  t = 0;
  if (hasRealAudio) narrationAudio.currentTime = 0;
  safeDraw();
});
$('#mute').addEventListener('click', () => {
  isMuted = !isMuted;
  if (hasRealAudio) narrationAudio.muted = isMuted;
  $('#mute').innerHTML = isMuted ? UNMUTE_SVG : MUTE_SVG;
  $('#mute').setAttribute('aria-label', isMuted ? 'Unmute audio' : 'Mute audio');
});

addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT/.test(document.activeElement.tagName)) {
    e.preventDefault();
    setPlaying(!playing);
  } else if (e.code === 'KeyM') {
    $('#mute').click();
  } else if (e.code === 'ArrowLeft') {
    t = Math.max(0, t - 2);
    if (hasRealAudio) narrationAudio.currentTime = t;
    safeDraw();
  } else if (e.code === 'ArrowRight') {
    t = Math.min(D.duration, t + 2);
    if (hasRealAudio) narrationAudio.currentTime = t;
    safeDraw();
  }
});

let dragging = false;
function seek(e) {
  const r = track.getBoundingClientRect();
  const x = Math.max(0, Math.min(r.width, e.clientX - r.left));
  t = (x / r.width) * D.duration;
  if (hasRealAudio) narrationAudio.currentTime = t;
  stopSpeech();
  safeDraw();
}
track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); seek(e); });
track.addEventListener('pointermove', e => { if (dragging) seek(e); });
track.addEventListener('pointerup', e => { dragging = false; });
track.addEventListener('pointercancel', e => { dragging = false; });

raf = requestAnimationFrame(frame);
</script>
</body>
</html>
